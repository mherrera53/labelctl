name: Renew Certificate

on:
  schedule:
    - cron: '0 6 1 * *'  # First day of every month at 6am UTC
  workflow_dispatch:       # Manual trigger

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check PAT for updating secrets
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Falta el secreto GH_PAT (fine-grained PAT con permiso Secrets: read/write sobre este repo). GITHUB_TOKEN no puede escribir secretos."
            exit 1
          fi

      - name: Install lego
        run: |
          LEGO_VER=$(curl -sL https://api.github.com/repos/go-acme/lego/releases/latest | jq -r .tag_name)
          curl -sL "https://github.com/go-acme/lego/releases/download/${LEGO_VER}/lego_${LEGO_VER}_linux_amd64.tar.gz" | tar xz lego
          sudo mv lego /usr/local/bin/
          lego --version

      - name: Renew certificate
        env:
          CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
        run: |
          lego --email="herrera.monterroso.mario@gmail.com" \
            --dns cloudflare \
            --domains="local.labelctl.dev" \
            --accept-tos \
            --path="./.lego" \
            run

      - name: Update GitHub secrets with new cert
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set LABELCTL_CERT -R "$GITHUB_REPOSITORY" < .lego/certificates/local.labelctl.dev.crt
          gh secret set LABELCTL_KEY -R "$GITHUB_REPOSITORY" < .lego/certificates/local.labelctl.dev.key
          rm -rf .lego
          echo "Secrets updated with renewed certificate"
